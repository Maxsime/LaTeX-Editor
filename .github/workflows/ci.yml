name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Integration tests start PostgreSQL, Valkey and SeaweedFS with Testcontainers.
      - run: pnpm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      # No dependency cache: the audit reads the lockfile only, and an empty store
      # would make the cache step fail the job. setup-node v5 enables the cache
      # on its own when package.json names a package manager, hence the flag.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm audit --audit-level=high

  stack:
    name: Images, compose stack and end-to-end tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # The compiler image carries a full TeX Live (about 9 GB unpacked); the
      # runner's preinstalled SDKs we never use make room for it.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Build application images
        uses: docker/bake-action@v6
        with:
          source: .
          files: compose.yaml
          targets: api,collab,caddy
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
      # Not cached: its TeX Live layers alone exceed the 10 GB Actions cache,
      # and pulling them from Docker Hub is faster than restoring them.
      - name: Build compiler image
        uses: docker/bake-action@v6
        with:
          source: .
          files: compose.yaml
          targets: compiler
          load: true
      # Ubuntu 24.04 lets AppArmor deny unprivileged user namespaces, which the
      # compilation sandbox needs; docs/operations.md covers the same host setting.
      - name: Allow user namespaces for the compilation sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker compose run --rm --no-deps --entrypoint bwrap compiler --unshare-all --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --proc /proc --dev /dev true && echo "sandbox ok"
      - name: Start the stack and require every service to be healthy
        run: scripts/compose-healthy.sh --no-build
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @galley/e2e
      - run: pnpm --filter @galley/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Compile the corpus in the sandbox
        run: pnpm --filter @galley/compiler test:corpus
      - name: Collect container logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            compose-logs.txt
          retention-days: 7
