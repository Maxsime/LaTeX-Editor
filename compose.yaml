# Complete Galley instance: docker compose up --build
# Every value has a working default; copy .env.example to .env to override.
name: galley

x-node-service: &node-service
  restart: unless-stopped
  # Docker's init (tini) forwards SIGTERM to Node and reaps zombie processes.
  init: true
  environment: &node-env
    NODE_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-info}
    VALKEY_URL: redis://valkey:6379

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-galley}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-galley-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-galley}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8.1.10-alpine
    restart: unless-stopped
    command: ['valkey-server', '--appendonly', 'yes']
    volumes:
      - valkey-data:/data
    networks: [data]
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage, replacing MinIO (see docs/decisions.md).
  storage:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    command: ['server', '-s3', '-ip.bind=0.0.0.0']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-galley}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-galley-dev-secret}
    volumes:
      - storage-data:/data
    networks: [data]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    <<: *node-service
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args: { SERVICE: api }
    image: galley/api:dev
    environment:
      <<: *node-env
      DATABASE_URL: postgres://${POSTGRES_USER:-galley}:${POSTGRES_PASSWORD:-galley-dev-password}@postgres:5432/${POSTGRES_DB:-galley}
      S3_ENDPOINT: http://storage:8333
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-galley}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-galley-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-galley}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      COLLAB_INTERNAL_URL: http://collab:3001
      COLLAB_INTERNAL_TOKEN: ${COLLAB_INTERNAL_TOKEN:-galley-dev-internal-token-change-me}
      GIT_MAX_PUSH_MB: ${GIT_MAX_PUSH_MB:-100}
      GIT_SYNC_HOSTS: ${GIT_SYNC_HOSTS:-github.com,gitlab.com}
      GIT_SYNC_ALLOW_HTTP: ${GIT_SYNC_ALLOW_HTTP:-false}
      # Development value: change it before storing real keys (openssl rand -base64 32).
      GALLEY_MASTER_KEY: ${GALLEY_MASTER_KEY:-Z2FsbGV5LWRldi1tYXN0ZXIta2V5LWNoYW5nZS1tZSE=}
      LANGUAGETOOL_URL: http://languagetool:8010
      CROSSREF_MAILTO: ${CROSSREF_MAILTO:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-}
      AI_DEFAULT_BASE_URL: ${AI_DEFAULT_BASE_URL:-}
      AI_DEFAULT_API_KEY: ${AI_DEFAULT_API_KEY:-}
      AI_DEFAULT_VISION: ${AI_DEFAULT_VISION:-}
      AI_DEFAULT_CONTEXT_TOKENS: ${AI_DEFAULT_CONTEXT_TOKENS:-}
      AI_ALLOW_USER_ENDPOINTS: ${AI_ALLOW_USER_ENDPOINTS:-false}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-20}
      # Public address: the API refuses the development secrets on any host but localhost.
      GALLEY_HOST: ${GALLEY_HOST:-localhost}
      GALLEY_HTTPS_PORT: ${GALLEY_HTTPS_PORT:-443}
      QUOTA_STORAGE_MB: ${QUOTA_STORAGE_MB:-}
      QUOTA_COMPILE_MINUTES: ${QUOTA_COMPILE_MINUTES:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_DISPLAY_NAME: ${OIDC_DISPLAY_NAME:-SSO}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_ALLOW_SIGNUP: ${OIDC_ALLOW_SIGNUP:-false}
      LINKED_URLS_ENABLED: ${LINKED_URLS_ENABLED:-true}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
    # A model served on the host (Ollama, LM Studio) is reached at host.docker.internal.
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      # One bare repository per project; rebuilt from the project if lost (SPEC §6.7).
      - git-data:/var/lib/galley/git
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      storage: { condition: service_healthy }
    networks: [data, edge]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health/ready']
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

  collab:
    <<: *node-service
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args: { SERVICE: collab }
    image: galley/collab:dev
    environment:
      <<: *node-env
      DATABASE_URL: postgres://${POSTGRES_USER:-galley}:${POSTGRES_PASSWORD:-galley-dev-password}@postgres:5432/${POSTGRES_DB:-galley}
      COLLAB_INTERNAL_TOKEN: ${COLLAB_INTERNAL_TOKEN:-galley-dev-internal-token-change-me}
      COLLAB_PERSIST_DEBOUNCE_MS: ${COLLAB_PERSIST_DEBOUNCE_MS:-2000}
      COLLAB_PERSIST_MAX_DEBOUNCE_MS: ${COLLAB_PERSIST_MAX_DEBOUNCE_MS:-10000}
    depends_on:
      # The API applies the migrations collab relies on.
      api: { condition: service_healthy }
      valkey: { condition: service_healthy }
    networks: [data, edge]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3001/health/ready']
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

  compiler:
    <<: *node-service
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      target: compiler-runtime
      args: { SERVICE: compiler }
    image: galley/compiler:dev
    environment:
      <<: *node-env
      S3_ENDPOINT: http://storage:8333
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-galley}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-galley-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-galley}
      COMPILER_CONCURRENCY: ${COMPILER_CONCURRENCY:-2}
      COMPILER_TIMEOUT_S: ${COMPILER_TIMEOUT_S:-180}
      COMPILER_MEMORY_MB: ${COMPILER_MEMORY_MB:-2048}
      COMPILER_MAX_PROCESSES: ${COMPILER_MAX_PROCESSES:-64}
      COMPILER_MAX_OUTPUT_MB: ${COMPILER_MAX_OUTPUT_MB:-500}
      COMPILER_WORK_QUOTA_MB: ${COMPILER_WORK_QUOTA_MB:-20480}
      COMPILER_ALLOW_FULL_SHELL_ESCAPE: ${COMPILER_ALLOW_FULL_SHELL_ESCAPE:-false}
    volumes:
      - compile-work:/var/lib/galley/work
    # Each compilation runs under bubblewrap (SPEC §6.3), which needs to create user
    # namespaces and mount a fresh /proc: the seccomp profile is Docker's default plus
    # the namespace calls, and systempaths=unconfined lifts the /proc masks that would
    # forbid the mount. Docker's default AppArmor profile denies every mount, bwrap's
    # included, on hosts that enforce AppArmor (Ubuntu): this container runs without it,
    # bwrap being the confinement (docs/decisions.md). The container itself keeps no
    # capability and a read-only root.
    security_opt:
      - no-new-privileges:true
      - seccomp=./infra/compiler/seccomp.json
      - systempaths=unconfined
      - apparmor=unconfined
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      valkey: { condition: service_healthy }
      storage: { condition: service_healthy }
    networks: [data]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:3002/health/ready']
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 20

  # Spelling and grammar (SPEC §3.7). Reached by the API only, on the internal network.
  languagetool:
    image: erikvl87/languagetool:6.8@sha256:ef8fa12cbd485166c9ceeb7139d76d56d07707a624da6bb1fc1fbb5411750527
    restart: unless-stopped
    environment:
      Java_Xms: 256m
      Java_Xmx: ${LANGUAGETOOL_MEMORY:-1g}
    networks: [data]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:8010/v2/languages']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 20

  caddy:
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    image: galley/caddy:dev
    restart: unless-stopped
    environment:
      GALLEY_HOST: ${GALLEY_HOST:-localhost}
      GALLEY_TLS: ${GALLEY_TLS:-internal}
    ports:
      - '${GALLEY_HTTP_PORT:-80}:80'
      - '${GALLEY_HTTPS_PORT:-443}:443'
    volumes:
      # Holds the local certificate authority; see README to trust it.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: { condition: service_healthy }
      collab: { condition: service_healthy }
    networks: [edge]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/healthz']
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional: docker compose --profile monitoring up -d (docs/operations.md).
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # Reachable from the server itself only; publish it through a tunnel or a proxy.
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    networks: [data, edge]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  # Caddy and the services it proxies.
  edge: {}
  # Datastores; not reachable from Caddy.
  data:
    internal: true

volumes:
  postgres-data: {}
  compile-work: {}
  valkey-data: {}
  storage-data: {}
  git-data: {}
  caddy-data: {}
  caddy-config: {}
  prometheus-data: {}
