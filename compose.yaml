# Complete Galley instance: docker compose up --build
# Every value has a working default; copy .env.example to .env to override.
name: galley

x-node-service: &node-service
  restart: unless-stopped
  # Docker's init (tini) forwards SIGTERM to Node and reaps zombie processes.
  init: true
  environment: &node-env
    NODE_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-info}
    VALKEY_URL: redis://valkey:6379

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-galley}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-galley-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-galley}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8.1.10-alpine
    restart: unless-stopped
    command: ['valkey-server', '--appendonly', 'yes']
    volumes:
      - valkey-data:/data
    networks: [data]
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage, replacing MinIO (see docs/decisions.md).
  storage:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    command: ['server', '-s3', '-ip.bind=0.0.0.0']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-galley}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-galley-dev-secret}
    volumes:
      - storage-data:/data
    networks: [data]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    <<: *node-service
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args: { SERVICE: api }
    image: galley/api:dev
    environment:
      <<: *node-env
      DATABASE_URL: postgres://${POSTGRES_USER:-galley}:${POSTGRES_PASSWORD:-galley-dev-password}@postgres:5432/${POSTGRES_DB:-galley}
      S3_ENDPOINT: http://storage:8333
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-galley}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-galley-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-galley}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      storage: { condition: service_healthy }
    networks: [data, edge]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health/ready']
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

  collab:
    <<: *node-service
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args: { SERVICE: collab }
    image: galley/collab:dev
    depends_on:
      valkey: { condition: service_healthy }
    networks: [data, edge]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3001/health/ready']
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

  compiler:
    <<: *node-service
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args: { SERVICE: compiler }
    image: galley/compiler:dev
    depends_on:
      valkey: { condition: service_healthy }
    networks: [data]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3002/health/ready']
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

  caddy:
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    image: galley/caddy:dev
    restart: unless-stopped
    environment:
      GALLEY_HOST: ${GALLEY_HOST:-localhost}
      GALLEY_TLS: ${GALLEY_TLS:-internal}
    ports:
      - '${GALLEY_HTTP_PORT:-80}:80'
      - '${GALLEY_HTTPS_PORT:-443}:443'
    volumes:
      # Holds the local certificate authority; see README to trust it.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: { condition: service_healthy }
      collab: { condition: service_healthy }
    networks: [edge]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/healthz']
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  # Caddy and the services it proxies.
  edge: {}
  # Datastores; not reachable from Caddy.
  data:
    internal: true

volumes:
  postgres-data: {}
  valkey-data: {}
  storage-data: {}
  caddy-data: {}
  caddy-config: {}
